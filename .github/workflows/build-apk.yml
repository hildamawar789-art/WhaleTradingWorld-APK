name: Build Whale Trading World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q WhaleTradingWorldAndroid_v194_project.zip
          echo "Project extracted"
          ls -la WhaleTradingWorldAndroid

      - name: Build APK
        working-directory: WhaleTradingWorldAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaleTradingWorld-v194-APK
          path: WhaleTradingWorldAndroid/app/build/outputs/apk/debug/*.apk
