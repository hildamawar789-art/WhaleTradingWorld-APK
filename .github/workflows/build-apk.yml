name: Build Whale Trading World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          unzip -q WhaleTradingWorldAndroid_v194_project.zip
          ls -la WhaleTradingWorldAndroid

      - name: Build APK
        working-directory: WhaleTradingWorldAndroid
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaleTradingWorld-v194-APK
          path: WhaleTradingWorldAndroid/app/build/outputs/apk/debug/*.apk
